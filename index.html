<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gratidão V71 - App com IA + AdSense</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2263470788888608" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#fff;font-family:Arial, sans-serif}
header{background:#000;border-bottom:2px solid #ffcc00;padding:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
header h1{color:#ffcc00;font-size:22px}
.btn{padding:10px 18px;border:none;border-radius:12px;font-weight:bold;cursor:pointer}
.btn-green{background:#22c55e;color:#fff}
.btn-white{background:#fff;color:#000}
.btn-yellow{background:#ffcc00;color:#000}
.search-box{display:flex;gap:10px;padding:10px;background:#000}
.search-box input{flex:1;padding:12px;border-radius:12px;border:none;background:#222;color:#fff}
.ad-box{margin:15px;border:1px dashed #ffcc00;border-radius:12px;min-height:120px;display:flex;align-items:center;justify-content:center;background:#1a1a1a}
footer{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:2px solid #ffcc00;padding:10px;display:flex;gap:8px;overflow-x:auto}
</style>
</head>
<body>
<header>
<h1>G GRATIDÃO V71 🤖</h1>
<div style="display:flex;gap:8px">
<button class="btn btn-yellow" onclick="abrirIA()">🤖 IA</button>
</div>
<div class="search-box" style="width:100%">
<input id="pesquisa" type="text" placeholder="Pesquisar..." oninput="filtrar()">
<button class="btn btn-yellow" onclick="filtrar()">🔍</button>
</div>
<div style="width:100%;display:flex;gap:8px;margin-top:8px">
<button class="btn btn-green" onclick="convidar()">📲 Convidar</button>
<button class="btn btn-white" onclick="apoiar()">⭐ Apoiar R$2,99</button>
<button class="btn btn-yellow" onclick="abrirIA()">🤖 IA</button>
</div>
</header>

<!-- ANÚNCIO 1 - TOPO -->
<div class="ad-box">
<ins class="adsbygoogle"
style="display:block"
data-ad-client="ca-pub-2263470788888608"
data-ad-slot="1234567890"
data-ad-format="auto"
data-full-width-responsive="true"></ins>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<!-- ANÚNCIO 2 -->
<div class="ad-box">
<ins class="adsbygoogle"
style="display:block"
data-ad-client="ca-pub-2263470788888608"
data-ad-slot="1234567890"
data-ad-format="auto"
data-full-width-responsive="true"></ins>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<div id="lista" style="padding:15px;padding-bottom:140px"></div>

<button onclick="abrirIA()" style="position:fixed;bottom:110px;right:15px;width:60px;height:60px;border-radius:50%;background:#ffcc00;border:none;font-size:30px">🤖</button>
<div style="position:fixed;bottom:70px;right:15px;background:#ffcc00;color:#000;padding:5px 10px;border-radius:10px;font-weight:bold;font-size:12px">Apoiar<br>2,99</div>

<footer>
<button class="btn btn-green" onclick="abrirMemoria()">📄 MEMÓRIA</button>
<button class="btn" style="background:#5aa9e6;color:#fff" onclick="abrirLink()">🔗 LINK</button>
<button class="btn btn-yellow" onclick="abrirGenero()">+ GÊNERO</button>
<button class="btn" style="background:#ff9500;color:#fff" onclick="fileBackup()">💾 BACKUP</button>
<button class="btn" style="background:#ef4444;color:#fff" onclick="resetar()">🗑️ RESET</button>
</footer>
<!-- MODAIS -->
<div id="modalIA" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:9999;padding:20px;overflow:auto">
<div style="background:#222;padding:20px;border-radius:15px;max-width:500px;margin:30px auto;border:2px solid #ffcc00">
<h2 style="color:#ffcc00">🤖 IA da Gratidão</h2>
<p style="margin:15px 0">Pergunte algo para sua IA:</p>
<input id="perguntaIA" type="text" placeholder="Ex: me dê 3 motivos para agradecer hoje" style="width:100%;padding:12px;border-radius:10px;border:none;background:#111;color:#fff">
<div style="display:flex;gap:10px;margin-top:15px">
<button class="btn btn-yellow" onclick="perguntarIA()" style="flex:1">Perguntar</button>
<button class="btn btn-white" onclick="fecharIA()" style="flex:1">Fechar</button>
</div>
<div id="respostaIA" style="margin-top:15px;background:#111;padding:15px;border-radius:10px;min-height:50px"></div>
</div>
</div>

<div id="modalMemoria" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:9999;padding:20px;overflow:auto">
<div style="background:#222;padding:20px;border-radius:15px;max-width:500px;margin:30px auto">
<h2>📄 Minha Memória</h2>
<div id="conteudoMemoria" style="margin-top:15px"></div>
<button class="btn btn-white" onclick="document.getElementById('modalMemoria').style.display='none'" style="width:100%;margin-top:15px">Fechar</button>
</div>
</div>

<script>
// ===== BANCO GRATIDÃO V71 CORRIGIDO =====
let banco = JSON.parse(localStorage.getItem('bancoGratidao_V71') || '[]');

function salvarBanco(){
localStorage.setItem('bancoGratidao_V71', JSON.stringify(banco));
}

function renderizar(){
let lista = document.getElementById('lista');
if(!lista) return;
if(banco.length === 0){
lista.innerHTML = <div style="text-align:center;padding:30px;background:#222;border-radius:15px"&gt; &lt;h3 style="color:#ffcc00"&gt;🙏 Seu Banco de Gratidão está vazio&lt;/h3&gt; &lt;p style="margin-top:10px"&gt;Clique em + GÊNERO para adicionar sua primeira gratidão!&lt;/p&gt; &lt;button class="btn btn-yellow" onclick="abrirGenero()" style="margin-top:15px"&gt;+ Adicionar Gratidão&lt;/button&gt; &lt;/div>;
return;
}
let html = '';
banco.slice().reverse().forEach((item, idxReal)=>{
let i = banco.length - 1 - idxReal;
html += <div style="background:#222;padding:15px;border-radius:12px;margin-bottom:12px;border-left:4px solid #ffcc00"&gt; &lt;div style="display:flex;justify-content:space-between"&gt;&lt;b style="color:#ffcc00"&gt;${item.genero || 'Geral'}</b><small>${item.data}&lt;/small&gt;&lt;/div&gt; &lt;p style="margin-top:8px"&gt;${item.texto}</p>
<button onclick="removerItem(${i})" style="margin-top:8px;background:#ef4444;color:#fff;border:none;padding:5px 10px;border-radius:6px"&gt;Apagar&lt;/button&gt; &lt;/div>;
});
lista.innerHTML = html;
}

function filtrar(){
let termo = document.getElementById('pesquisa').value.toLowerCase();
let lista = document.getElementById('lista');
let filtrados = banco.filter(b => b.texto.toLowerCase().includes(termo) || (b.genero||'').toLowerCase().includes(termo));
if(termo === ''){ renderizar(); return; }
let html = '';
filtrados.reverse().forEach(item=>{
html += <div style="background:#222;padding:15px;border-radius:12px;margin-bottom:12px"&gt;&lt;b style="color:#ffcc00"&gt;${item.genero}</b><p style="margin-top:8px">${item.texto}&lt;/p&gt;&lt;/div>;
});
lista.innerHTML = html || '<p style="text-align:center;padding:20px">Nada encontrado</p>';
}

function abrirGenero(){
let genero = prompt('Qual o gênero? Ex: Família, Saúde, Trabalho, Deus');
if(!genero) return;
let texto = prompt(Escreva sua gratidão de ${genero}:`);
if(!texto) return;
banco.push({genero: genero, texto: texto, data: new Date().toLocaleString('pt-BR')});
salvarBanco();
renderizar();
alert('Gratidão salva! 🙏');
}

function abrirMemoria(){
let modal = document.getElementById('modalMemoria');
let conteudo = document.getElementById('conteudoMemoria');
conteudo.innerHTML = <p&gt;Total de gratidões: &lt;b&gt;${banco.length}</b></p><div style="margin-top:15px;max-height:300px;overflow:auto">latex
{banco.map(b=>`<div style="padding:8px;border-bottom:1px solid #444"&gt;&lt;b&gt;

{b.genero}</b>: ${b.texto.substring(0,50)}...&lt;/div>).join('')}</div>`;
modal.style.display = 'block';
}

function abrirLink(){
let link = prompt('Cole o link que deseja salvar junto:');
if(link) { alert('Link salvo: '+link); }
}

function fileBackup(){
// CORRIGIDO V71 - aspas que faltava
let dados = JSON.stringify(banco, null, 2);
let blob = new Blob([dados], {type: "application/json"});
let url = URL.createObjectURL(blob);
let a = document.createElement("a");
a.href = url;
a.download = "backup-gratidao-V71.json";
a.click();
}

function resetar(){
if(confirm('Apagar TUDO mesmo? Não tem volta!')){
banco = [];
salvarBanco();
renderizar();
}
}

function convidar(){
if(navigator.share){
navigator.share({title:'Banco Gratidão', text:'Olha esse app de gratidão!', url: window.location.href});
}else{
prompt('Copie e envie para um amigo:', window.location.href);
}
}

function apoiar(){
window.open('https://www.mercadopago.com.br', '_blank');
alert('Obrigado pelo apoio de R`$2,99! 🙏 Deus abençoe!');
}

// IA
function abrirIA(){ document.getElementById('modalIA').style.display='block'; }
function fecharIA(){ document.getElementById('modalIA').style.display='none'; }
function perguntarIA(){
let p = document.getElementById('perguntaIA').value;
let r = document.getElementById('respostaIA');
if(!p){ r.innerHTML='Escreva uma pergunta!'; return; }
r.innerHTML = '🤖 Pensando...';
setTimeout(()=>{
r.innerHTML = Gratidão por perguntar: "${p}"&lt;br&gt;&lt;br&gt;✨ &lt;b&gt;Resposta da IA:&lt;/b&gt; Hoje é um ótimo dia para agradecer por 3 coisas: 1) Sua saúde, 2) Sua família, 3) A oportunidade de recomeçar. O que você agradece hoje? 🙏;
}, 1000);
}

// INICIAR
renderizar();
console.log('G GRATIDÃO V71 CARREGADO COM SUCESSO');
</script>
</body>
</html>
